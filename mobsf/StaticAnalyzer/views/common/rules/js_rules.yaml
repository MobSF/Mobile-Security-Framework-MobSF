  languages: [javascript, typescript, tsx]
  message: >-
    Biometric authentication allows device passcode/credential fallback without
    cryptographic key binding (disableDeviceFallback: false or
    allowDeviceCredentials: true). This can be bypassed on rooted/jailbroken
    devices via Frida hooking if not backed by Keystore/Keychain crypto objects.
  severity: warning
  pattern:
    - >-
      (pair
        key: [(property_identifier) (string)] @_k
        (#match? @_k "^['\"]?(allowDeviceCredentials)['\"]?$")
        value: (true)) @match
    - >-
      (pair
        key: [(property_identifier) (string)] @_k
        (#match? @_k "^['\"]?(disableDeviceFallback)['\"]?$")
        value: (false)) @match
  metadata:
    cvss: 0
    cwe: cwe-287
    owasp-mobile: m4
    masvs: auth-8

