        (#match? @_k "^['\"]?originWhitelist['\"]?$")
        value: (array (string) @_v (#match? @_v "^['\"](\\*|http://\\*)['\"]$"))) @match
    - >-
      (assignment_expression
        left: [
          (member_expression
            property: (property_identifier) @_p (#eq? @_p "originWhitelist"))
