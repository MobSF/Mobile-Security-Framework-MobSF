    - >-
      (pair
        key: [(property_identifier) (string)] @_k
        (#match? @_k "^['\"]?dangerouslySetInnerHTML['\"]?$")) @match
    - >-
      (assignment_expression
        left: [
          (member_expression
            property: (property_identifier) @_p (#match? @_p "^(innerHTML|outerHTML)$"))
          (subscript_expression
            index: (string) @_s (#match? @_s "^['\"](innerHTML|outerHTML)['\"]$"))
        ]) @match
    - >-
      (call_expression
        function: [
          (member_expression
            property: (property_identifier) @_fn
            (#eq? @_fn "insertAdjacentHTML"))
          (member_expression
            object: (_) @_doc (#match? @_doc "(^|\\.)document$")
            property: (property_identifier) @_fn
            (#match? @_fn "^(write|writeln)$"))
