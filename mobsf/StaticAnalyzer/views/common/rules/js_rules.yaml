  severity: warning
  pattern:
    - >-
      (call_expression
        function: (member_expression
          object: (_) @_obj
          (#match? @_obj "(AsyncStorage|localStorage|sessionStorage)")
          property: (property_identifier) @_fn
          (#match? @_fn "^(setItem|multiSet)$"))
        arguments: (arguments
          (string) @_key
          (#match? @_key "(?i)(token|password|passwd|secret|api[_-]?key|private[_-]?key|jwt|session|credential|pin|ssn)"))) @match
  metadata:
    cvss: 6.5
    cwe: cwe-312
    owasp-mobile: m2
    masvs: storage-1

