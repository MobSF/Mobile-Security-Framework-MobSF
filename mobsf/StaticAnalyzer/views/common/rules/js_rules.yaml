        (property_identifier) @_prop
        (#match? @_prop "^(allowFileAccess|allowFileAccessFromFileURLs|allowUniversalAccessFromFileURLs)$")
        (jsx_expression (true))) @match
    - >-
      (pair
        key: [(property_identifier) (string)] @_k
        (#match? @_k "^['\"]?(allowFileAccess|allowFileAccessFromFileURLs|allowUniversalAccessFromFileURLs)['\"]?$")
        value: (true)) @match
    - >-
      (assignment_expression
        left: [
          (member_expression
            property: (property_identifier) @_p
            (#match? @_p "^(allowFileAccess|allowFileAccessFromFileURLs|allowUniversalAccessFromFileURLs)$"))
          (subscript_expression
            index: (string) @_s
            (#match? @_s "^['\"](allowFileAccess|allowFileAccessFromFileURLs|allowUniversalAccessFromFileURLs)['\"]$"))
