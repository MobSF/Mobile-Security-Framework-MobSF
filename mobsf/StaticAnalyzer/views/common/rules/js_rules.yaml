            property: (property_identifier) @_p
            (#match? @_p "^(rejectUnauthorized|NODE_TLS_REJECT_UNAUTHORIZED)$"))
          (subscript_expression
            index: (string) @_s
            (#match? @_s "^['\"](rejectUnauthorized|NODE_TLS_REJECT_UNAUTHORIZED)['\"]$"))
