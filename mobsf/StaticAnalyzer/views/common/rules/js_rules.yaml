- id: js_webview_javascript_enabled
  type: TreeSitter
  languages: [javascript, typescript, tsx]
  message: >-
    WebView has JavaScript execution enabled. Ensure untrusted web content is
    not loaded into a JavaScript-enabled WebView, and restrict any native
    bridge interfaces exposed to web content.
  severity: warning
  pattern:
    - >-
      (jsx_attribute
        (property_identifier) @_prop (#eq? @_prop "javaScriptEnabled")
        (jsx_expression (true))) @match
    - >-
      (jsx_opening_element
        name: (identifier) @_tag (#eq? @_tag "WebView")
        attribute: (jsx_attribute
          (property_identifier) @_prop (#eq? @_prop "javaScriptEnabled")
          !value)) @match
    - >-
      (pair
        key: [(property_identifier) (string)] @_k
        (#match? @_k "^['\"]?javaScriptEnabled['\"]?$")
        value: (true)) @match
    - >-
      (assignment_expression
        left: [
          (member_expression
            property: (property_identifier) @_p (#eq? @_p "javaScriptEnabled"))
          (subscript_expression
            index: (string) @_s (#match? @_s "^['\"]javaScriptEnabled['\"]$"))
        ]
        right: (true)) @match
  metadata:
    cvss: 5.3
    cwe: cwe-79
    owasp-mobile: m7
    masvs: platform-2

