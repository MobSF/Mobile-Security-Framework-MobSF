  severity: info
  pattern:
    - >-
      (call_expression
        function: (member_expression
          object: (_) @_obj (#match? @_obj "(^|\\.)console$")
          property: (property_identifier) @_fn
          (#match? @_fn "^(log|debug|info|warn|error)$"))
        arguments: (arguments) @_args
        (#match? @_args "(?i)(password|passwd|secret|access[_-]?token|auth[_-]?token|refresh[_-]?token|private[_-]?key|api[_-]?key|bearer)")) @match
  exclude_ancestor: >-
    (if_statement
