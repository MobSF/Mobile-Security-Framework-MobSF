    extracted from the application package.
  severity: high
  pattern:
    - >-
      (variable_declarator
        name: (identifier) @_name
        (#match? @_name "(?i)(^|_)(api[_-]?key|secret[_-]?key|client[_-]?secret|private[_-]?key|access[_-]?token|auth[_-]?token|jwt[_-]?secret|stripe[_-]?secret|aws[_-]?secret)$")
        value: (string) @_val
        (#match? @_val "^['\"][^'\"\\s]{12,}['\"]$")) @match
    - >-
      (pair
        key: [(property_identifier) (string)] @_k
        (#match? @_k "(?i)^['\"]?([a-z0-9_]*_)?(api[_-]?key|secret[_-]?key|client[_-]?secret|private[_-]?key|access[_-]?token|auth[_-]?token|jwt[_-]?secret|stripe[_-]?secret|aws[_-]?secret)['\"]?$")
        value: (string) @_val
        (#match? @_val "^['\"][^'\"\\s]{12,}['\"]$")) @match
    - >-
      (assignment_expression
        left: [
          (member_expression
            property: (property_identifier) @_p
            (#match? @_p "(?i)(^|_)(api[_-]?key|secret[_-]?key|client[_-]?key|client[_-]?secret|private[_-]?key|access[_-]?token|auth[_-]?token|jwt[_-]?secret)$"))
          (subscript_expression
            index: (string) @_s
            (#match? @_s "(?i)^['\"]([a-z0-9_]*_)?(api[_-]?key|secret[_-]?key|client[_-]?secret|private[_-]?key|access[_-]?token|auth[_-]?token|jwt[_-]?secret)['\"]$"))
        ]
        right: (string) @_val
        (#match? @_val "^['\"][^'\"\\s]{12,}['\"]$")) @match
    - >-
      ((string) @_tok
        (#match? @_tok "^['\"](sk_live_[0-9a-zA-Z_]{10,}|rk_live_[0-9a-zA-Z_]{10,}|ghp_[0-9a-zA-Z]{30,}|AKIA[0-9A-Z]{16}|eyJ[A-Za-z0-9_-]{10,}\\.eyJ[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,}|-----BEGIN [A-Z ]*PRIVATE KEY-----|(Secret|API[_ -]?Key|Auth[_ -]?Token|Access[_ -]?Token)\\s*[:=]\\s*\\S{8,})")) @match
