<script>
if (document.documentElement.classList.contains('dark-mode')) {
  document.body.classList.add('dark-mode');
}

window.mobsfHighlight = function (el, opts) {
  if (!el || !window.Prism) {
    return;
  }
  opts = opts || {};
  var lang = (opts.language || 'clike').toLowerCase();
  if (lang === 'text') {
    lang = 'none';
  }
  var pre = el.tagName === 'PRE' ? el : el.closest('pre');
  var code = el.tagName === 'CODE' ? el : el.querySelector('code');
  if (!code && pre) {
    var txt = pre.textContent;
    pre.textContent = '';
    code = document.createElement('code');
    code.textContent = txt;
    pre.appendChild(code);
  }
  if (!pre || !code) {
    return;
  }
  pre.className = 'line-numbers language-' + lang;
  code.className = 'language-' + lang;
  if (opts.startLine && parseInt(opts.startLine, 10) > 1) {
    pre.setAttribute('data-start', String(opts.startLine));
  } else {
    pre.removeAttribute('data-start');
  }
  if (opts.highlight && String(opts.highlight) !== '0') {
    pre.setAttribute('data-line', String(opts.highlight));
    if (opts.startLine && parseInt(opts.startLine, 10) > 1) {
      pre.setAttribute('data-line-offset', String(parseInt(opts.startLine, 10) - 1));
    } else {
      pre.removeAttribute('data-line-offset');
    }
  } else {
    pre.removeAttribute('data-line');
    pre.removeAttribute('data-line-offset');
  }
  Prism.highlightElement(code);
  var hl = pre.querySelector('.line-highlight');
  if (hl) {
    if (hl.scrollIntoViewIfNeeded) {
      hl.scrollIntoViewIfNeeded();
    } else {
      hl.scrollIntoView({ block: 'center' });
    }
  }
};
</script>
