<p class="mb-1"><strong><i class="fas fa-box-open"></i> FILE INFORMATION</strong></p>
<dl class="info-grid">
  <dt>File Name</dt><dd>{{ file_name }}</dd>
  <dt>Size</dt><dd>{{ size }}</dd>
  <dt>MD5</dt><dd class="mono">{{ md5 }}</dd>
  <dt>SHA1</dt><dd class="mono">{{ sha1 }}</dd>
  <dt>SHA256</dt><dd class="mono">{{ sha256 }}</dd>
</dl>
