<script>
(function () {
  var theme;
  try {
    theme = localStorage.getItem('mobsf-theme');
  } catch (e) {
    theme = null;
  }
  if (theme === 'dark') {
    document.documentElement.classList.add('dark-mode');
  }
})();
</script>
