{% load static %}
<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="utf-8">
      <meta http-equiv="X-UA-Compatible" content="IE=edge">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <meta name="description" content="Mobile Security Framework (MobSF) is an automated, all-in-one mobile application (Android/iOS/Windows) pen-testing, malware analysis and security assessment framework capable of performing static and dynamic analysis.">
      <meta name="author" content="Ajin Abraham">
      <link rel="icon" href="{% static "img/favicon.ico" %}">
      <title>Mobile Security Framework - MobSF</title>
      <link rel="stylesheet" href="{% static "adminlte/dashboard/css/adminlte.min.css" %}">
      <link rel="stylesheet" href="{% static "adminlte/plugins/fontawesome-free/css/all.min.css" %}">
      <link rel="stylesheet" href="{% static "others/css/spinner.css" %}">
      <link rel="stylesheet" href="{% static "landing/css/home.css" %}">
   </head>
   <body class="text-center">

    <div class="home-shell">
        {% include "general/includes/landing_nav.html" %}

        <main role="main" class="home-main">
            <div id="drop">
                <div id="textnode">Drop anywhere!</div>
            </div>
            <form id="upload_form" enctype="multipart/form-data" method="post">
                {% csrf_token %}
                <label class="fileUpload drop-zone" id="but">
                    <input type="file" name="file" id="uploadFile" multiple>
                    <span class="fas fa-cloud-upload-alt" aria-hidden="true"></span>
                    <span class="drop-title">Upload &amp; Analyze</span>
                    <small>Drag &amp; drop anywhere</small>
                </label>
                <h5 class="lead" id="status"></h5>
                <progress id="progressBar" value="0" max="100"></progress>
            </form>
        </main>

        {% include "general/includes/landing_footer.html" %}
    </div>

    <!--Loading Ring-->
    <div class="hidden loading">
        <div class='uil-ring-css' style='transform:scale(0.79);'>
          <div></div>
        </div>
    </div>

    <script src="{% static "adminlte/plugins/jquery.min.js" %}"></script>
    <script src="{% static "adminlte/plugins/bootstrap/bootstrap.bundle.min.js" %}"></script>
      <script>
            let warning = "This is a demo MobSF instance. Anything uploaded here will be publicly available. Do you want to continue?";
            var statusTimer = null;
            var analysisStarted = false;
            function show_started_alert(){
                hide_loader();
                var x = document.getElementById("alert");
                x.className = "alert-bar show slide-up";
                setTimeout(function () {
                    x.className = x.className.replace("show", "");
                }, 10000);
            }
            // Result View
            function load_result(url){
                show_started_alert();
                // Redirect after showing alertbar
                setTimeout(function () {
                    window.location.href = url;
                }, 1000); // Adjust delay as needed
            }

            function hide_loader(){
                var loadingOverlay = document.querySelector('.loading');
                loadingOverlay.classList.add('hidden');
            }
            // Existing
            function _(el){
                return document.getElementById(el);
            }

            // Response Handler
            function responseHandler(json, isbutton) {
                if (json.status === 'error') {
                    _("status").innerText = json.description;
                    return;
                }
                // Stay on this page while the report request runs the scan.
                // Navigating now freezes the last upload line for the whole analysis.
                var url = json.analyzer + '/' + json.hash + '/';
                analysisStarted = true;
                _("status").innerText = "Analyzing ...";
                show_started_alert();
                if (statusTimer) {
                    clearInterval(statusTimer);
                }
                statusTimer = setInterval(function() {
                    get_status(json.hash);
                }, 500);
                fetch(url, {credentials: 'same-origin', cache: 'no-store'})
                    .catch(function() {})
                    .then(function() {
                        if (statusTimer) {
                            clearInterval(statusTimer);
                            statusTimer = null;
                        }
                        window.location.href = url;
                    });
            }


           // Get Scan status
           function get_status(checksum){
                var xhr = new XMLHttpRequest();
                xhr.open("POST", '{% url "status" %}', true);
                xhr.setRequestHeader("X-CSRFToken", '{{ csrf_token }}');
                xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest')
                xhr.setRequestHeader("Content-type", "application/x-www-form-urlencoded");
                xhr.onload = function() {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        var response = JSON.parse(xhr.responseText);
                        if (response.status === 'ok' && Array.isArray(response.logs) && response.logs.length) {
                            const last_log = response.logs[response.logs.length - 1];
                            if (last_log && last_log.status && last_log.status !== 'init') {
                                _("status").innerText = last_log.status;
                            }
                        }
                    } else {
                        console.log("Error:", xhr.statusText);
                    }
                };
                xhr.onerror = function() {
                    console.log("Failed to get scan status");
                };
                xhr.send('hash=' + checksum);
           }

            var uploadPending = [];
            var uploadResults = [];
            var uploadActive = false;
            var uploadDone = 0;
            var uploadTotal = 0;

            function progressHandler(event) {
                var percent = (event.loaded / event.total) * 100;
                var rounded = Math.round(percent);
                _("progressBar").value = rounded;
                if (analysisStarted) {
                    return;
                }
                if (uploadTotal > 1) {
                    _("status").innerText = "Uploading " + uploadDone + " of " + uploadTotal + " — " + rounded + "%";
                } else {
                    _("status").innerText = rounded + "% Uploaded ...";
                }
            }
            function finishUploads() {
                var results = uploadResults.slice();
                uploadResults = [];
                if (!results.length) {
                    _("progressBar").style.visibility = "hidden";
                    return;
                }
                // One file keeps the report redirect. Several files would
                // otherwise navigate away while later uploads are still open.
                if (results.length === 1 && uploadTotal === 1) {
                    responseHandler(results[0]);
                    return;
                }
                load_result('{% url "recent" %}');
            }
            function noteUploadFailure(message) {
                _("status").innerText = message;
                startNextUpload();
            }
            function completeHandler(event) {
                if (event.currentTarget.status === 403) {
                    uploadPending = [];
                    uploadActive = false;
                    _("status").innerText = "You do not have permission to upload!";
                    if (uploadResults.length) {
                        finishUploads();
                    } else {
                        _("progressBar").style.visibility = "hidden";
                    }
                    return;
                }
                try {
                    var json = JSON.parse(event.target.responseText);
                    if (json.status === 'error') {
                        noteUploadFailure(json.description || "Upload Failed!");
                        return;
                    }
                    uploadResults.push(json);
                    startNextUpload();
                } catch (error) {
                    noteUploadFailure("Upload Failed!");
                }
            }
            function errorHandler(event) {
                noteUploadFailure("Upload Failed!");
            }
            function abortHandler(event) {
                noteUploadFailure("Upload Aborted!");
            }
          // Is valid file extensions
          function isValidExt(file_name){
                var val = file_name.toLowerCase();
                var regex = new RegExp("^(.{1,300}?)\.({{exts}})$");
                val = val.replace(/^.*[\\\/]/, '');
                if (!(regex.test(val))) {
                    _('status').innerText = "MobSF only supports APK, APKS, XAPK, AAB, JAR, AAR, DEX, SO, IPA, DYLIB, A, ZIP, and APPX files.";
                    return false;
                }
                return true;
          }
          // Is allowed mimetype
          function isValidMime(file_mime){
                if (file_mime.length < 1)
                    // bypass if mime is not available
                    return true; 
                var supported = [{% for mime in mimes %}'{{mime}}',{% endfor %}];
                if(supported.indexOf(file_mime) >-1)
                    return true;
                 _('status').innerText = "MIME type (" + file_mime + ") is not supported!";
                return false;
          }
         // File Upload
         function uploadFile(file) {
           try {
                if (!isValidExt(file.name) || !isValidMime(file.type)){
                    startNextUpload();
                    return;
                }
                _("progressBar").value = 0;
                _("progressBar").style.visibility = "visible";
                if (uploadTotal > 1) {
                    _("status").innerText = "Uploading " + uploadDone + " of " + uploadTotal + "...";
                } else {
                    _("status").innerText = "Uploading ...";
                }
                var url = '{% url "upload" %}'
                var xhr = new XMLHttpRequest()
                xhr.open('POST', url, true)
                xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest')
                xhr.setRequestHeader("X-CSRFToken", '{{ csrf_token }}');
                xhr.upload.addEventListener("progress", progressHandler, false);
                xhr.addEventListener("load", completeHandler, false);
                xhr.addEventListener("error", errorHandler, false);
                xhr.addEventListener("abort", abortHandler, false);
                var formdata = new FormData();
                formdata.append("file", file);
                xhr.send(formdata)
            } catch (e) {
                alert("Error:" + e);
                startNextUpload();
            }
           }

           function startNextUpload() {
                if (!uploadPending.length) {
                    uploadActive = false;
                    finishUploads();
                    return;
                }
                var file = uploadPending.shift();
                uploadDone += 1;
                uploadFile(file);
           }

           function queueUploads(fileList) {
                var accepted = [];
                Array.prototype.forEach.call(fileList, function(file) {
                    if (isValidExt(file.name) && isValidMime(file.type)) {
                        accepted.push(file);
                    }
                });
                if (!accepted.length) {
                    return;
                }
                if (!uploadActive) {
                    uploadPending = [];
                    uploadResults = [];
                    uploadDone = 0;
                    uploadTotal = 0;
                    uploadActive = true;
                }
                var starting = !uploadPending.length && uploadDone === 0;
                uploadPending = uploadPending.concat(accepted);
                uploadTotal += accepted.length;
                if (starting) {
                    startNextUpload();
                }
           }

           function handleFiles(files) {
               queueUploads(files);
           }
         
           // Full Screen Drag & Drop File Upload
           var lastTarget = null;
           function isFile(evt) {
               var dt = evt.dataTransfer;
         
               for (var i = 0; i < dt.types.length; i++) {
                   if (dt.types[i] === "Files") {
                       return true;
                   }
               }
               return false;
           }
         
           window.addEventListener("dragenter", function (e) {
               if (isFile(e)) {
                   lastTarget = e.target;
                   document.querySelector("#drop").style.visibility = "visible";
                   document.querySelector("#drop").style.opacity = 1;
                   document.querySelector("#textnode").style.fontSize = "48px";
               }
           });
         
           window.addEventListener("dragleave", function (e) {
               e.preventDefault();
               if (e.target === document || e.target === lastTarget) {
                   document.querySelector("#drop").style.visibility = "hidden";
                   document.querySelector("#drop").style.opacity = 0;
                   document.querySelector("#textnode").style.fontSize = "42px";
               }
           });
         
           window.addEventListener("dragover", function (e) {
               e.preventDefault();
           });
         
           window.addEventListener("drop", function (e) {
               e.preventDefault();
               document.querySelector("#drop").style.visibility = "hidden";
               document.querySelector("#drop").style.opacity = 0;
               document.querySelector("#textnode").style.fontSize = "42px";
               if(e.dataTransfer.files.length > 0) {
                if (document.location.host === 'mobsf.live'){
                    if (confirm(warning) == true) {
                        handleFiles(e.dataTransfer.files);
                    } else {
                        return;
                    }
                } else {
                    handleFiles(e.dataTransfer.files);
                }
               }
           });

            $(document).ready(function() {
                // Button File Upload
                $('input[type=file]').change(function() {
                    _('status').innerText = "";
                    if (_("uploadFile").files.length === 0) {
                        return;
                    }
                    var files = _("uploadFile").files;
                    if (document.location.host === 'mobsf.live'){
                        if (confirm(warning) == true) {
                            _("uploadFile").style.display = "none";
                            handleFiles(files);
                        } else {
                            return;
                        }
                    } else {
                        _("uploadFile").style.display = "none";
                        handleFiles(files);
                    }
                });
            });
      </script>
   </body>
</html>
