name: 'Build and Publish Release to DockerHub'

on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
    buildx:
        runs-on: ubuntu-latest
        steps:
        -
            name: Checkout
            uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        -
            name: Set up QEMU
            uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        -
            name: Set up Docker Buildx
            uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        -
            name: Login to DockerHub
            uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
            with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_TOKEN }}
        -
            name: Get Release Tag
            id: release
            run: |
              DOCKER_IMAGE=opensecurity/mobile-security-framework-mobsf
              if [[ $GITHUB_REF == refs/tags/* ]]; then
                VERSION=${GITHUB_REF#refs/tags/v}
                TAG="${DOCKER_IMAGE}:v${VERSION}"
              fi
              echo "tag=${TAG}" >> $GITHUB_OUTPUT
        -
            name: Build and push AMD64, ARM64 image release
            id: docker_build
            uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
            with:
                push: true
                provenance: mode=max
                sbom: true
                context: .
                platforms: linux/amd64,linux/arm64
                tags: ${{ steps.release.outputs.tag }}
