name: 'Build and Publish Release to DockerHub'

on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
    buildx:
        runs-on: ubuntu-latest
        steps:
        -
            name: Checkout
            uses: actions/checkout@v7
        -
            name: Set up QEMU
            uses: docker/setup-qemu-action@v4
        -
            name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v4
        -
            name: Login to DockerHub
            uses: docker/login-action@v4
            with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_TOKEN }}
        -
            name: Get Release Tag
            id: release
            run: |
              DOCKER_IMAGE=opensecurity/mobile-security-framework-mobsf
              if [[ $GITHUB_REF == refs/tags/* ]]; then
                VERSION=${GITHUB_REF#refs/tags/v}
                TAG="${DOCKER_IMAGE}:v${VERSION}"
              fi
              echo "tag=${TAG}" >> $GITHUB_OUTPUT
        -
            name: Build and push AMD64, ARM64 image release
            id: docker_build
            uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
            with:
                push: true
                provenance: mode=max
                sbom: true
                context: .
                platforms: linux/amd64,linux/arm64
                tags: ${{ steps.release.outputs.tag }}
